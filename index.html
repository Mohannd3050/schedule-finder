<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جدول الفريق · OPS Schedule</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230f172a' width='192' height='192'/><circle cx='96' cy='96' r='80' fill='%2300d9ff'/></svg>">
  <meta name="theme-color" content="#0f172a">
  <style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--glass:#1a1f3a;--border:#00d9ff;--text:#e0e7ff;--accent:#a78bfa}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px;overflow-x:hidden}
body.light{--bg:#f8fafc;--glass:#e0e7ff;--border:#06b6d4;--text:#1e293b;--accent:#9333ea}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:8px}
.topbar .title{flex:1;text-align:center;padding:12px;background:rgba(0,217,255,0.1);border:1px solid var(--border);border-radius:20px;font-weight:600;font-size:14px}
.btn-theme{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:20px}
.btn-lang{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer}

#loginCard{max-width:400px;margin:40px auto;padding:24px;background:rgba(26,31,58,0.5);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(10px)}
#loginCard input{width:100%;padding:12px;margin:12px 0;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,0.05);color:var(--text);font-size:16px}
#loginCard button{width:100%;padding:14px;margin-top:20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:16px}

#scheduleContainer{display:none}
.week{margin-bottom:40px;padding:20px;background:rgba(26,31,58,0.4);border:1px solid var(--border);border-radius:12px}
.weekTitle{font-size:20px;font-weight:700;margin-bottom:16px;color:var(--border)}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.agent{padding:16px;background:rgba(167,139,250,0.1);border:1px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:all 0.3s}
.agent:hover{transform:translateY(-4px);background:rgba(167,139,250,0.2)}
.agent .name{font-weight:600;margin-bottom:4px}
.agent .status{font-size:11px;margin-top:4px;padding:4px;background:rgba(0,217,255,0.2);border-radius:4px}

#breakCard{padding:20px;background:rgba(26,31,58,0.5);border:1px solid var(--border);border-radius:12px;margin-bottom:20px;text-align:center}
#breakTimer{font-size:48px;font-weight:700;color:var(--accent);margin:16px 0}
#breakStatus{font-size:14px;opacity:0.8}
.breakBtn{padding:12px 24px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;margin-top:12px}

#alertPopup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;display:none;justify-content:center;align-items:center}
#alertPopup.show{display:flex}
#alertContent{background:var(--glass);border:2px solid var(--border);border-radius:16px;padding:32px;max-width:90%;text-align:center;backdrop-filter:blur(10px)}
#alertContent .icon{font-size:60px;margin-bottom:16px}
#alertContent .message{font-size:18px;margin:16px 0;line-height:1.6}
#alertContent button{padding:12px 32px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:16px;margin-top:20px}

.footer{text-align:center;margin-top:40px;opacity:0.6;font-size:12px}
.ver{display:inline-block;padding:4px 12px;border:1px solid var(--border);border-radius:4px;margin:0 4px}

@media(max-width:480px){
  .agents{grid-template-columns:repeat(2,1fr)}
  #alertContent{max-width:95%}
}
  </style>
</head>
<body>

<div class="topbar">
  <button class="btn-theme" onclick="toggleTheme()">🌙</button>
  <div class="title">جدول الفريق · OPS Schedule 🟢</div>
  <button class="btn-lang" onclick="toggleLang()">EN</button>
</div>

<div id="loginCard">
  <h2 style="text-align:center;margin-bottom:24px">باحث الجدول</h2>
  <p style="text-align:center;margin-bottom:16px;font-size:14px;opacity:0.8">أدخل رقمك الوظيفي (HRID) لعرض جدولك</p>
  <input type="text" id="hridInput" placeholder="رقمك الوظيفي (HRID)" autocomplete="off">
  <button onclick="loginHRID()">دخول</button>
  <p style="text-align:center;margin-top:16px;font-size:12px;opacity:0.6">ملاحظة: الرقم محفوظ محلياً فقط</p>
</div>

<div id="scheduleContainer">
  <div id="breakCard" style="display:none">
    <div id="breakStatus">البريك متوقّف</div>
    <div id="breakTimer">00:00</div>
    <button class="breakBtn" id="breakBtn" onclick="toggleBreak()">بدء البريك</button>
    <button class="breakBtn" style="background:#666;margin-left:8px" onclick="resetBreak()">إعادة ضبط</button>
  </div>
  <div id="weeksContainer"></div>
</div>

<div id="alertPopup">
  <div id="alertContent">
    <div class="icon">⚠️</div>
    <div class="message" id="alertMessage"></div>
    <button id="alertBtn" onclick="closeAlert()">موافق</button>
  </div>
</div>

<div class="footer">
  تمت بواسطة مهند الغامدي · #94467
  <div class="ver">v6</div>
</div>

<script src="https://www.gstatic.com/firebaseapp/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebaseapp/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebaseapp/8.10.0/firebase-auth.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCCRyoWDVCvL4y_pW2U8CcUUUb13ynKfdo",
  authDomain: "d360-schedule.firebaseapp.com",
  databaseURL: "https://d360-schedule-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "d360-schedule",
  storageBucket: "d360-schedule.firebasestorage.app",
  messagingSenderId: "616387729679",
  appId: "1:616387729679:web:9c2b01dd325ae1530f867a"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var auth = firebase.auth();

var CURRENT_HRID = localStorage.getItem("hrid") || null;
var breakState = {state:"idle",startTime:0,pausedTime:0};

// ===== STARTUP =====
window.addEventListener("load", function(){
  if(CURRENT_HRID){
    showSchedule();
  }
});

// ===== AUTH =====
function loginHRID(){
  var hrid = document.getElementById("hridInput").value.trim();
  if(!hrid){alert("أدخل رقمك الوظيفي");return;}
  CURRENT_HRID = hrid;
  localStorage.setItem("hrid", hrid);
  auth.signInAnonymously().then(function(){
    showSchedule();
  }).catch(function(err){
    alert("خطأ في الدخول: " + err.message);
  });
}

function showSchedule(){
  document.getElementById("loginCard").style.display = "none";
  document.getElementById("scheduleContainer").style.display = "block";
  document.getElementById("breakCard").style.display = "block";
  
  startPresenceTracking();
  startAlertListener();
  subscribeSchedule();
}

// ===== PRESENCE =====
function startPresenceTracking(){
  if(!db || !CURRENT_HRID) return;
  var sid = auth.currentUser.uid;
  var ref = db.ref("presence/" + sid);
  
  setInterval(function(){
    var onBreak = breakState.state === "running";
    ref.set({
      ts: firebase.database.ServerValue.TIMESTAMP,
      hrid: CURRENT_HRID,
      name: "الموظف #" + CURRENT_HRID,
      lob: "OPS",
      onBreak: onBreak
    }).catch(function(e){console.log("Presence error:", e.message);});
  }, 20000);
}

// ===== ALERTS =====
function startAlertListener(){
  if(!db || !CURRENT_HRID) return;
  var ref = db.ref("alerts/" + CURRENT_HRID);
  ref.off();
  ref.on("value", function(snap){
    var data = snap.val();
    if(data && data.msg){
      showAlertPopup(data.msg);
      ref.remove().catch(function(){});
    }
  }, function(err){
    console.log("Alert error:", err.message);
  });
}

function showAlertPopup(msg){
  document.getElementById("alertMessage").textContent = msg;
  document.getElementById("alertPopup").classList.add("show");
  if(navigator.vibrate) navigator.vibrate(300);
}

function closeAlert(){
  document.getElementById("alertPopup").classList.remove("show");
}

// ===== SCHEDULE =====
function subscribeSchedule(){
  if(!db || !CURRENT_HRID) return;
  db.ref("weeks").on("value", function(snap){
    var weeks = snap.val() || {};
    var today = new Date();
    today.setHours(0,0,0,0);
    
    var activeWeeks = Object.entries(weeks).filter(function(entry){
      var week = entry[1];
      var meta = week.meta || {};
      var firstDay = new Date(meta.dayCols && meta.dayCols[0] ? meta.dayCols[0].day : today);
      var lastDay = new Date(meta.dayCols && meta.dayCols[meta.dayCols.length-1] ? meta.dayCols[meta.dayCols.length-1].day : today);
      return firstDay <= today && lastDay >= today;
    });
    
    if(activeWeeks.length === 0){
      activeWeeks = Object.entries(weeks).slice(-1);
    }
    
    var html = "";
    activeWeeks.forEach(function(entry){
      var weekId = entry[0];
      var week = entry[1];
      var meta = week.meta || {};
      var agents = week.agents || {};
      var agent = agents[CURRENT_HRID];
      
      if(!agent) return;
      
      var dateRange = "";
      if(meta.dayCols && meta.dayCols.length > 0){
        var first = meta.dayCols[0].day || "---";
        var last = meta.dayCols[meta.dayCols.length-1].day || "---";
        dateRange = first + " — " + last;
      }
      
      html += '<div class="week"><div class="weekTitle">' + (meta.sheetName || weekId) + '</div>';
      html += '<div style="font-size:12px;opacity:0.7;margin-bottom:12px">' + dateRange + '</div>';
      html += '<div class="agents">';
      
      if(agent.days){
        agent.days.forEach(function(day, idx){
          var dayName = meta.dayCols && meta.dayCols[idx] ? meta.dayCols[idx].day : ("يوم " + idx);
          var status = day || "—";
          html += '<div class="agent"><div class="name">' + dayName + '</div><div class="status">' + status + '</div></div>';
        });
      }
      
      html += '</div></div>';
    });
    
    document.getElementById("weeksContainer").innerHTML = html;
  });
}

// ===== BREAK TIMER =====
function toggleBreak(){
  if(breakState.state === "idle" || breakState.state === "paused"){
    breakState.state = "running";
    breakState.startTime = Date.now() - breakState.pausedTime;
    document.getElementById("breakBtn").textContent = "إيقاف البريك";
  } else {
    breakState.state = "paused";
    breakState.pausedTime = Date.now() - breakState.startTime;
    document.getElementById("breakBtn").textContent = "استئناف البريك";
  }
  updateBreakTimer();
}

function resetBreak(){
  breakState = {state:"idle", startTime:0, pausedTime:0};
  document.getElementById("breakBtn").textContent = "بدء البريك";
  document.getElementById("breakTimer").textContent = "00:00";
}

function updateBreakTimer(){
  var elapsed = 0;
  if(breakState.state === "running"){
    elapsed = Math.floor((Date.now() - breakState.startTime) / 1000);
  } else {
    elapsed = Math.floor(breakState.pausedTime / 1000);
  }
  
  var min = Math.floor(elapsed / 60);
  var sec = elapsed % 60;
  document.getElementById("breakTimer").textContent = (min < 10 ? "0" : "") + min + ":" + (sec < 10 ? "0" : "") + sec;
  
  if(breakState.state === "running"){
    setTimeout(updateBreakTimer, 1000);
  }
}

// ===== THEME & LANG =====
function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
  document.querySelector(".btn-theme").textContent = document.body.classList.contains("light") ? "☀️" : "🌙";
}

function toggleLang(){
  var isAr = document.documentElement.lang === "ar";
  document.documentElement.lang = isAr ? "en" : "ar";
  document.documentElement.dir = isAr ? "ltr" : "rtl";
  document.querySelector(".btn-lang").textContent = isAr ? "ع" : "EN";
}

// Load theme
if(localStorage.getItem("theme") === "light"){
  document.body.classList.add("light");
  document.querySelector(".btn-theme").textContent = "☀️";
}
</script>

</body>
</html>
