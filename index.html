<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جدول الفريق · OPS Schedule</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230f172a' width='192' height='192'/><circle cx='96' cy='96' r='80' fill='%2300d9ff'/></svg>">
  <meta name="theme-color" content="#0f172a">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;--glass:rgba(255,255,255,0.04);--glass-brd:rgba(255,255,255,0.1);
  --mint:#34d399;--teal:#2dd4bf;--violet:#a78bfa;--purple:#8b5cf6;
  --text:#e6ecff;--text-dim:#9aa6c4;--text-faint:#6b7694;
}
*{-webkit-tap-highlight-color:transparent}
body{
  font-family:'SF Pro Display','Segoe UI','Tajawal',system-ui,Arial,sans-serif;
  color:var(--text);min-height:100vh;padding:16px 14px 40px;overflow-x:hidden;
  background:
    radial-gradient(1100px 600px at 80% -5%, rgba(45,212,191,0.18), transparent 55%),
    radial-gradient(900px 700px at 10% 110%, rgba(139,92,246,0.20), transparent 55%),
    linear-gradient(180deg,#0a0e1a 0%,#0c1226 100%);
  background-attachment:fixed;
}
body.light{
  --bg:#eef2fb;--glass:rgba(255,255,255,0.7);--glass-brd:rgba(15,23,42,0.08);
  --text:#0f172a;--text-dim:#475569;--text-faint:#94a3b8;
  background:
    radial-gradient(1100px 600px at 80% -5%, rgba(45,212,191,0.20), transparent 55%),
    radial-gradient(900px 700px at 10% 110%, rgba(139,92,246,0.18), transparent 55%),
    linear-gradient(180deg,#f4f7fe 0%,#e8edfb 100%);
}

/* ===== TOPBAR ===== */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:10px}
.topbar .title{
  flex:1;text-align:center;padding:14px 16px;font-weight:700;font-size:14.5px;letter-spacing:.2px;
  background:var(--glass);border:1px solid var(--glass-brd);border-radius:18px;
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  box-shadow:0 8px 32px rgba(0,0,0,0.25),inset 0 1px 0 rgba(255,255,255,0.08);
}
.btn-theme,.btn-lang{
  width:48px;height:48px;border-radius:16px;border:1px solid var(--glass-brd);
  background:var(--glass);color:var(--text);cursor:pointer;font-size:20px;font-weight:700;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 8px 24px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.08);
  transition:transform .15s ease,box-shadow .2s ease;flex-shrink:0;
}
.btn-theme:active,.btn-lang:active{transform:scale(0.94)}

/* ===== LOGIN CARD ===== */
#loginCard{
  max-width:440px;margin:24px auto;padding:32px 26px;
  background:var(--glass);border:1px solid var(--glass-brd);border-radius:26px;
  backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
  box-shadow:0 20px 60px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.1);
}
#loginCard h2{
  text-align:center;margin-bottom:14px;font-size:30px;font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(135deg,#fff 0%,var(--teal) 60%,var(--violet) 120%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
body.light #loginCard h2{background:linear-gradient(135deg,#0f172a 0%,var(--teal) 90%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#loginCard p{text-align:center;margin-bottom:22px;font-size:14px;color:var(--text-dim);line-height:1.7}
#loginCard input{
  width:100%;padding:16px 18px;margin:6px 0;font-size:16px;color:var(--text);
  background:rgba(255,255,255,0.05);border:1px solid var(--glass-brd);border-radius:16px;
  transition:border-color .2s ease,box-shadow .2s ease;outline:none;
}
#loginCard input::placeholder{color:var(--text-faint)}
#loginCard input:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(45,212,191,0.15)}
#loginCard button{
  width:100%;padding:17px;margin-top:18px;font-size:17px;font-weight:800;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--violet),var(--purple));border:none;border-radius:16px;
  box-shadow:0 12px 28px rgba(139,92,246,0.4),inset 0 1px 0 rgba(255,255,255,0.2);
  transition:transform .15s ease,box-shadow .2s ease;
}
#loginCard button:active{transform:scale(0.97)}

/* ===== SCHEDULE ===== */
#scheduleContainer{display:none;max-width:760px;margin:0 auto}

/* ===== BREAK CARD ===== */
#breakCard{
  padding:26px 24px;margin-bottom:24px;text-align:center;
  background:var(--glass);border:1px solid var(--glass-brd);border-radius:24px;
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  box-shadow:0 16px 44px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.08);
}
#breakStatus{font-size:14.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600}
#breakTimer{
  font-size:60px;font-weight:800;letter-spacing:-1px;margin:8px 0 20px;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,var(--violet),var(--teal));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.breakBtn{
  padding:14px 26px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--violet),var(--purple));border:none;border-radius:14px;
  box-shadow:0 10px 24px rgba(139,92,246,0.35);transition:transform .15s ease;
}
.breakBtn:active{transform:scale(0.95)}

/* ===== WEEKS / DAYS ===== */
.week{
  margin-bottom:28px;padding:22px 20px;
  background:var(--glass);border:1px solid var(--glass-brd);border-radius:24px;
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 14px 40px rgba(0,0,0,0.28),inset 0 1px 0 rgba(255,255,255,0.06);
}
.weekTitle{
  font-size:20px;font-weight:800;margin-bottom:18px;
  background:linear-gradient(135deg,var(--teal),var(--mint));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.agent{
  padding:18px 14px;text-align:center;cursor:default;
  background:rgba(255,255,255,0.04);border:1px solid var(--glass-brd);border-radius:18px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.agent:hover{transform:translateY(-4px);border-color:rgba(45,212,191,0.4);box-shadow:0 12px 28px rgba(0,0,0,0.3)}
.agent .name{font-weight:700;margin-bottom:10px;font-size:14px;color:var(--text-dim)}
.agent .status{
  font-size:20px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;
}
/* today highlight */
.agent.today{
  border-color:var(--teal);
  background:linear-gradient(160deg,rgba(45,212,191,0.14),rgba(45,212,191,0.03));
  box-shadow:0 0 0 1px rgba(45,212,191,0.3),0 16px 40px rgba(45,212,191,0.18);
}

/* ===== ALERT POPUP ===== */
#alertPopup{
  position:fixed;inset:0;width:100%;height:100%;z-index:9999;display:none;
  justify-content:center;align-items:center;padding:24px;
  background:rgba(5,8,18,0.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
#alertPopup.show{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#alertContent{
  max-width:380px;width:100%;padding:36px 28px;text-align:center;
  background:linear-gradient(160deg,rgba(255,255,255,0.1),rgba(255,255,255,0.04));
  border:1px solid rgba(255,255,255,0.18);border-radius:28px;
  backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 30px 80px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.15);
  animation:popIn .3s cubic-bezier(.2,1.2,.4,1);
}
@keyframes popIn{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
#alertContent .icon{font-size:64px;margin-bottom:18px;animation:shake .5s ease}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
#alertContent .message{font-size:19px;font-weight:600;margin:14px 0;line-height:1.7;color:var(--text)}
#alertContent button{
  padding:14px 40px;margin-top:22px;font-size:16px;font-weight:800;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--violet),var(--purple));border:none;border-radius:14px;
  box-shadow:0 12px 28px rgba(139,92,246,0.4);transition:transform .15s ease;
}
#alertContent button:active{transform:scale(0.96)}

/* ===== FOOTER ===== */
.footer{text-align:center;margin-top:36px;color:var(--text-faint);font-size:13px}
.ver{
  display:inline-block;padding:5px 14px;margin:0 6px;font-weight:700;font-size:12px;
  border:1px solid var(--glass-brd);border-radius:10px;background:var(--glass);
}

@media(max-width:480px){
  .agents{grid-template-columns:repeat(3,1fr);gap:10px}
  #breakTimer{font-size:52px}
  #loginCard h2{font-size:26px}
  .agent{padding:14px 8px}
  .agent .status{font-size:17px}
}
  </style>
</head>
<body>

<div class="topbar">
  <button class="btn-theme" onclick="toggleTheme()">🌙</button>
  <div class="title">جدول الفريق · OPS Schedule 🟢</div>
  <button class="btn-lang" onclick="toggleLang()">EN</button>
</div>

<div id="loginCard">
  <h2 style="text-align:center;margin-bottom:24px">باحث الجدول</h2>
  <p style="text-align:center;margin-bottom:16px;font-size:14px;opacity:0.8">أدخل رقمك الوظيفي (HRID) لعرض جدولك</p>
  <input type="text" id="hridInput" placeholder="رقمك الوظيفي (HRID)" autocomplete="off">
  <button onclick="loginHRID()">دخول</button>
  <p style="text-align:center;margin-top:16px;font-size:12px;opacity:0.6">ملاحظة: الرقم محفوظ محلياً فقط</p>
</div>

<div id="scheduleContainer">
  <div id="breakCard" style="display:none">
    <div id="breakStatus">البريك متوقّف</div>
    <div id="breakTimer">00:00</div>
    <button class="breakBtn" id="breakBtn" onclick="toggleBreak()">بدء البريك</button>
    <button class="breakBtn" style="background:#666;margin-left:8px" onclick="resetBreak()">إعادة ضبط</button>
  </div>
  <div id="weeksContainer"></div>
</div>

<div id="alertPopup">
  <div id="alertContent">
    <div class="icon">⚠️</div>
    <div class="message" id="alertMessage"></div>
    <button id="alertBtn" onclick="closeAlert()">موافق</button>
  </div>
</div>

<div class="footer">
  تمت بواسطة مهند الغامدي · #94467
  <div class="ver">v6</div>
</div>

<script src="https://www.gstatic.com/firebaseapp/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebaseapp/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebaseapp/8.10.0/firebase-auth.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCCRyoWDVCvL4y_pW2U8CcUUUb13ynKfdo",
  authDomain: "d360-schedule.firebaseapp.com",
  databaseURL: "https://d360-schedule-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "d360-schedule",
  storageBucket: "d360-schedule.firebasestorage.app",
  messagingSenderId: "616387729679",
  appId: "1:616387729679:web:9c2b01dd325ae1530f867a"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var auth = firebase.auth();

window.dbg = window.dbg || function(m){try{console.log(m)}catch(e){}};
var CURRENT_HRID = localStorage.getItem("hrid") || null;
var breakState = {state:"idle",startTime:0,pausedTime:0};

// ===== STARTUP =====
window.addEventListener("load", function(){
  if(CURRENT_HRID){
    showSchedule();
  }
});

// ===== AUTH =====
function loginHRID(){
  var hrid = document.getElementById("hridInput").value.trim();
  if(!hrid){alert("أدخل رقمك الوظيفي");return;}
  CURRENT_HRID = hrid;
  localStorage.setItem("hrid", hrid);
  auth.signInAnonymously().then(function(){
    showSchedule();
  }).catch(function(err){
    alert("خطأ في الدخول: " + err.message);
  });
}

function showSchedule(){
  document.getElementById("loginCard").style.display = "none";
  document.getElementById("scheduleContainer").style.display = "block";
  document.getElementById("breakCard").style.display = "block";
  
  startPresenceTracking();
  startAlertListener();
  subscribeSchedule();
}

// ===== PRESENCE =====
function startPresenceTracking(){
  if(!db || !CURRENT_HRID) return;
  var sid = auth.currentUser.uid;
  var ref = db.ref("presence/" + sid);
  
  setInterval(function(){
    var onBreak = breakState.state === "running";
    ref.set({
      ts: firebase.database.ServerValue.TIMESTAMP,
      hrid: CURRENT_HRID,
      name: "الموظف #" + CURRENT_HRID,
      lob: "OPS",
      onBreak: onBreak
    }).catch(function(e){console.log("Presence error:", e.message);});
  }, 20000);
}

// ===== ALERTS =====
function startAlertListener(){
  if(!db || !CURRENT_HRID){ dbg("❌ لا يوجد db أو HRID"); return; }
  dbg("🔔 بدأ مراقبة الإنذارات لـ " + CURRENT_HRID);
  var ref = db.ref("alerts/" + CURRENT_HRID);
  ref.off();
  ref.on("value", function(snap){
    var data = snap.val();
    dbg("📬 بيانات الإنذار: " + JSON.stringify(data));
    if(data && data.msg){
      dbg("⚠️ عرض نافذة الإنذار");
      showAlertPopup(data.msg);
    }
  }, function(err){
    dbg("❌ خطأ القراءة: " + err.code + " - " + err.message);
  });
  // إعادة الفحص عند العودة للتبويب (حل تجميد iOS)
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden && db && CURRENT_HRID){
      dbg("👁️ عاد التبويب - إعادة فحص الإنذار");
      db.ref("alerts/" + CURRENT_HRID).once("value").then(function(s){
        var d = s.val();
        if(d && d.msg){ dbg("⚠️ إنذار موجود عند العودة"); showAlertPopup(d.msg); }
      });
    }
  });
}

function showAlertPopup(msg){
  document.getElementById("alertMessage").textContent = msg;
  document.getElementById("alertPopup").classList.add("show");
  if(navigator.vibrate) navigator.vibrate(300);
}

function closeAlert(){
  document.getElementById("alertPopup").classList.remove("show");
  if(db && CURRENT_HRID){
    dbg("✓ المستخدم أغلق الإنذار - حذف من القاعدة");
    db.ref("alerts/" + CURRENT_HRID).remove()
      .then(function(){ dbg("✓ تم حذف الإنذار"); })
      .catch(function(e){ dbg("❌ فشل الحذف: " + e.message); });
  }
}

// ===== SCHEDULE =====
function subscribeSchedule(){
  if(!db || !CURRENT_HRID) return;
  db.ref("weeks").on("value", function(snap){
    var weeks = snap.val() || {};
    var today = new Date();
    today.setHours(0,0,0,0);
    
    var activeWeeks = Object.entries(weeks).filter(function(entry){
      var week = entry[1];
      var meta = week.meta || {};
      var firstDay = new Date(meta.dayCols && meta.dayCols[0] ? meta.dayCols[0].day : today);
      var lastDay = new Date(meta.dayCols && meta.dayCols[meta.dayCols.length-1] ? meta.dayCols[meta.dayCols.length-1].day : today);
      return firstDay <= today && lastDay >= today;
    });
    
    if(activeWeeks.length === 0){
      activeWeeks = Object.entries(weeks).slice(-1);
    }
    
    var html = "";
    activeWeeks.forEach(function(entry){
      var weekId = entry[0];
      var week = entry[1];
      var meta = week.meta || {};
      var agents = week.agents || {};
      var agent = agents[CURRENT_HRID];
      
      if(!agent) return;
      
      var dateRange = "";
      if(meta.dayCols && meta.dayCols.length > 0){
        var first = meta.dayCols[0].day || "---";
        var last = meta.dayCols[meta.dayCols.length-1].day || "---";
        dateRange = first + " — " + last;
      }
      
      html += '<div class="week"><div class="weekTitle">' + (meta.sheetName || weekId) + '</div>';
      html += '<div style="font-size:12px;opacity:0.7;margin-bottom:12px">' + dateRange + '</div>';
      html += '<div class="agents">';
      
      if(agent.days){
        agent.days.forEach(function(day, idx){
          var dayName = meta.dayCols && meta.dayCols[idx] ? meta.dayCols[idx].day : ("يوم " + idx);
          var status = day || "—";
          html += '<div class="agent"><div class="name">' + dayName + '</div><div class="status">' + status + '</div></div>';
        });
      }
      
      html += '</div></div>';
    });
    
    document.getElementById("weeksContainer").innerHTML = html;
  });
}

// ===== BREAK TIMER =====
function toggleBreak(){
  if(breakState.state === "idle" || breakState.state === "paused"){
    breakState.state = "running";
    breakState.startTime = Date.now() - breakState.pausedTime;
    document.getElementById("breakBtn").textContent = "إيقاف البريك";
  } else {
    breakState.state = "paused";
    breakState.pausedTime = Date.now() - breakState.startTime;
    document.getElementById("breakBtn").textContent = "استئناف البريك";
  }
  updateBreakTimer();
}

function resetBreak(){
  breakState = {state:"idle", startTime:0, pausedTime:0};
  document.getElementById("breakBtn").textContent = "بدء البريك";
  document.getElementById("breakTimer").textContent = "00:00";
}

function updateBreakTimer(){
  var elapsed = 0;
  if(breakState.state === "running"){
    elapsed = Math.floor((Date.now() - breakState.startTime) / 1000);
  } else {
    elapsed = Math.floor(breakState.pausedTime / 1000);
  }
  
  var min = Math.floor(elapsed / 60);
  var sec = elapsed % 60;
  document.getElementById("breakTimer").textContent = (min < 10 ? "0" : "") + min + ":" + (sec < 10 ? "0" : "") + sec;
  
  if(breakState.state === "running"){
    setTimeout(updateBreakTimer, 1000);
  }
}

// ===== THEME & LANG =====
function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
  document.querySelector(".btn-theme").textContent = document.body.classList.contains("light") ? "☀️" : "🌙";
}

function toggleLang(){
  var isAr = document.documentElement.lang === "ar";
  document.documentElement.lang = isAr ? "en" : "ar";
  document.documentElement.dir = isAr ? "ltr" : "rtl";
  document.querySelector(".btn-lang").textContent = isAr ? "ع" : "EN";
}

// Load theme
if(localStorage.getItem("theme") === "light"){
  document.body.classList.add("light");
  document.querySelector(".btn-theme").textContent = "☀️";
}
</script>


<div id="dbgPanel" style="position:fixed;bottom:0;left:0;right:0;max-height:40vh;background:#0a0a14;color:#0f0;font-family:monospace;font-size:11px;overflow-y:auto;z-index:99999;border-top:2px solid #0f0;display:none;padding:8px;direction:ltr;text-align:left">
  <button onclick="document.getElementById('dbgPanel').style.display='none'" style="position:sticky;top:0;float:right;background:#0f0;color:#000;border:none;padding:2px 8px;border-radius:4px;font-weight:700">✕</button>
  <div id="dbgOut"></div>
</div>
<button onclick="var p=document.getElementById('dbgPanel');p.style.display=p.style.display==='none'?'block':'none'" style="position:fixed;bottom:12px;left:12px;z-index:99998;background:#0f0;color:#000;border:none;width:44px;height:44px;border-radius:50%;font-size:20px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.5)">🐛</button>
<script>
window.dbg=function(m){
  try{
    var t=new Date().toLocaleTimeString();
    var o=document.getElementById('dbgOut');
    if(o){o.innerHTML+='<div style="border-bottom:1px solid #222;padding:3px 0">['+t+'] '+m+'</div>';o.parentElement.scrollTop=o.parentElement.scrollHeight;}
  }catch(e){}
  try{console.log(m)}catch(e){}
};
dbg("✅ النظام جاهز - اضغط 🐛 لمتابعة الإنذارات");
</script>
</body>
</html>
