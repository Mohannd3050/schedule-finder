<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الأدمن · Admin Panel</title>
<!-- ... نفس الـ head والـ style السابق ... -->
<style>
  /* نفس الـ CSS السابق + إضافات جديدة */
  .swap-card {background:var(--glass2);border:1px solid var(--stroke);border-radius:16px;padding:16px;margin-bottom:12px;}
  .swap-status {padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;}
  .pending {background:#f59e0b;color:#000;}
  .approved {background:#10b981;color:#fff;}
  .rejected {background:#ef4444;color:#fff;}
</style>
</head>
<body>
<!-- ... نفس المحتوى السابق ... -->

<div id="dash" class="hidden">
  <!-- ... باقي الـ Dashboard ... -->

  <!-- قسم جديد: طلبات تبديل الشفت -->
  <div class="card">
    <h2 style="margin-bottom:16px">🔄 طلبات تبديل الشفت</h2>
    <div id="swapRequestsList" style="max-height:500px;overflow-y:auto"></div>
    <button class="primary" onclick="loadSwapRequests()" style="margin-top:12px">تحديث الطلبات</button>
  </div>

</div>

<script>
// ... الكود السابق ...

// === قسم طلبات تبديل الشفت للأدمن ===
function loadSwapRequests() {
  if(!db) return;
  const container = $("swapRequestsList");
  container.innerHTML = "<p>جاري التحميل...</p>";

  db.ref("swapRequests").once("value", snap => {
    const requests = snap.val() || {};
    if(Object.keys(requests).length === 0) {
      container.innerHTML = "<p style='color:var(--faint);text-align:center;padding:30px'>لا توجد طلبات تبديل حالياً</p>";
      return;
    }

    let html = "";
    Object.entries(requests).forEach(([id, req]) => {
      const statusText = req.finalStatus === "approved" ? "معتمد" : 
                         req.finalStatus === "rejected" ? "مرفوض" : "معلق";
      const statusClass = req.finalStatus === "approved" ? "approved" : 
                          req.finalStatus === "rejected" ? "rejected" : "pending";

      html += `
        <div class="swap-card">
          <div style="display:flex;justify-content:space-between">
            <div>
              <strong>طلب #${id.slice(-6)}</strong><br>
              <small>من: ${req.requesterHRID} → إلى: ${req.targetHRID}</small>
            </div>
            <span class="swap-status ${statusClass}">${statusText}</span>
          </div>
          <div style="margin:10px 0;font-size:13px;color:var(--dim)">
            اليوم: ${req.dayIndex || "غير محدد"} | ملاحظة: ${req.note || "بدون ملاحظة"}
          </div>
          ${req.finalStatus !== "approved" ? `
          <div style="display:flex;gap:8px">
            <button onclick="approveSwap('${id}')" style="flex:1;background:#10b981;color:white">✅ اعتماد</button>
            <button onclick="rejectSwap('${id}')" style="flex:1;background:#ef4444;color:white">❌ رفض</button>
          </div>` : ''}
        </div>`;
    });
    container.innerHTML = html;
  });
}

function approveSwap(id) {
  if(confirm("تأكيد اعتماد هذا التبديل؟")) {
    db.ref(`swapRequests/${id}`).update({
      finalStatus: "approved",
      adminRespondedAt: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
      alert("تم اعتماد التبديل بنجاح");
      loadSwapRequests();
    });
  }
}

function rejectSwap(id) {
  if(confirm("تأكيد رفض هذا التبديل؟")) {
    db.ref(`swapRequests/${id}`).update({
      finalStatus: "rejected",
      adminRespondedAt: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
      alert("تم رفض التبديل");
      loadSwapRequests();
    });
  }
}

// استدعاء التحميل عند فتح الداشبورد
setTimeout(() => {
  if(document.getElementById("dash").classList.contains("hidden") === false) {
    loadSwapRequests();
  }
}, 1500);
</script>
</body>
</html>
